<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas Varez</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#EDF1F5;--surf:#fff;--ink:#16263B;--mute:#5E6E82;--line:#D5DCE5;--acc:#2A5D8F;--soft:#DDE8F3;--pos:#17794F;--neg:#B83A2B;--warn:#9A6200;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1722;--surf:#17212F;--ink:#E6ECF3;--mute:#93A3B7;--line:#283548;--acc:#6FA6DA;--soft:#1E2E42;--pos:#4FC08A;--neg:#F0806F;--warn:#E0B055;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1722;--surf:#17212F;--ink:#E6ECF3;--mute:#93A3B7;--line:#283548;--acc:#6FA6DA;--soft:#1E2E42;--pos:#4FC08A;--neg:#F0806F;--warn:#E0B055;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif}
main,header{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:18px;padding-bottom:6px}
header h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
header small{display:block;color:var(--mute);font-size:13px;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 0}
main{padding-bottom:160px}
h2{font-size:15px;font-weight:600;margin:26px 0 8px}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;margin:10px 0 14px}
.seg button{flex:1;border:0;background:none;padding:8px 0;border-radius:7px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.hero{padding:10px 0 14px}
.lbl{margin:0;color:var(--mute);font-size:14px}
.big{margin:2px 0 0;font-size:46px;font-weight:800;letter-spacing:-.025em;line-height:1.1;font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.ledger{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.r{display:flex;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.r:last-child{border-bottom:0}
.r.t{background:var(--soft);font-weight:800}
.note{color:var(--mute);font-size:14px;margin:12px 0 0}
.note b{color:var(--ink)}
.add{width:100%;border:0;background:var(--acc);color:#fff;font-weight:600;padding:13px;border-radius:10px;margin-bottom:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item small{display:block;color:var(--mute);font-size:13px}
.item .amt{text-align:right;font-variant-numeric:tabular-nums}
.item .amt b{display:block}
.edit{cursor:pointer}
.x{background:none;border:0;color:var(--mute);font-size:12px;padding:4px 0 0;text-decoration:underline}
.x.arm{color:var(--neg);font-weight:600}
.empty{color:var(--mute);padding:22px 0;text-align:center}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--soft);color:var(--acc);margin-right:6px}
.debt{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.debt b{font-size:20px;font-variant-numeric:tabular-nums}
.debt small{display:block;color:var(--mute);font-size:13px}
nav{position:fixed;left:12px;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;overflow-x:auto;scrollbar-width:none;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.18);background:var(--surf);border:1px solid var(--line);z-index:5}
nav button{flex:1 0 auto;border:0;background:none;padding:14px 8px 13px;font-size:12px;font-weight:600;color:var(--mute)}
nav button.on{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#sh .bk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
#sh .pn{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surf);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));z-index:11;max-width:560px;margin:0 auto}
#sh h3{margin:0 0 10px;font-size:18px}
#sh p{margin:0 0 10px;color:var(--mute);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:12px;font:400 16px Archivo,system-ui,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{height:140px;font-size:13px}
.pr{display:flex;gap:8px;align-items:center;margin-top:8px}
.pr .pnm{flex:2;margin-top:0}
.pr .pcs{flex:1;margin-top:0}
.xr{border:0;background:none;color:var(--mute);font-size:18px;padding:0 4px}
.bar{height:8px;background:var(--soft);border-radius:4px;margin:-2px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pos)}
.pr .lnm{flex:2;margin-top:0}
.pr .lpr,.pr .lmn{flex:1;margin-top:0;min-width:0}
.pr .pis{flex:1.5;margin-top:0;padding:12px 6px;min-width:0}
.pr input[hidden]{display:none}
.ir{border-bottom:1px dashed var(--line);padding-bottom:10px;margin-top:10px}
.ir .pr{margin-top:6px}
.pr .isp{flex:1;margin-top:0;min-width:0;padding:12px 6px}
.pr .iq{flex:.6;margin-top:0;min-width:0}
.pr .itp{flex:1.5;margin-top:0;min-width:0;padding:12px 6px}
.pr .ipr{flex:1;margin-top:0;min-width:0}
.btns{display:flex;gap:10px;margin-top:16px}
.btns button{flex:1;padding:13px;border-radius:10px;border:0;font-weight:600;background:var(--acc);color:#fff}
.btns .ghost{background:var(--soft);color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90%}
#toast[hidden],#sh[hidden]{display:none}
</style>
</head>
<body>
<header><div><h1>Cuentas Varez</h1><small>Ventas, gastos, inversiones y deudas</small></div><button class="link" id="bk">Respaldo</button></header>
<main id="v"></main>
<nav id="nav"></nav>
<div id="sh" hidden></div>
<div id="toast" hidden></div>
<script>
const K='varez-cuentas-v1';
let S={products:[],sales:[],exp:[],mov:[],clients:[],pays:[],buys:[],fixed:[],init:{},goal:0,ins:[]};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{recost();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fm=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-AR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=s=>s.slice(8,10)+'/'+s.slice(5,7);
function pn(s){s=String(s).trim();if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'');return parseFloat(s.replace(',','.'))||0}
const TABS=[['res','Resumen'],['ven','Ventas'],['inv','Invertir'],['gas','Gastos'],['pro','Productos'],['cli','Clientes'],['pla','Plata']];
const PER=[['d','Hoy'],['w','Semana'],['m','Mes'],['a','Todo']];
const PL={d:'de hoy',w:'de esta semana',m:'de este mes',a:'en total'};
const MOV={saque:'Usé plata del negocio',repuse:'Repuse plata al negocio',pedi:'Pedí prestado',devolvi:'Devolví un préstamo'};
let tab='res',per='w';

function inP(date,p){
  if(p==='a')return true;
  const t=today();
  if(p==='d')return date===t;
  if(p==='m')return date.slice(0,7)===t.slice(0,7);
  const d=new Date(t+'T00:00'),s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));
  const e=new Date(s);e.setDate(s.getDate()+6);
  const x=new Date(date+'T00:00');return x>=s&&x<=e;
}
function calc(p){
  const sl=S.sales.filter(s=>inP(s.date,p)),ex=S.exp.filter(e=>inP(e.date,p));
  const rev=sum(sl,s=>s.qty*s.price),cogs=sum(sl,s=>s.qty*s.cost);
  const gas=sum(ex.filter(e=>e.type==='gasto'),e=>e.amount),invx=sum(ex.filter(e=>e.type==='inversion'),e=>e.amount),bu=S.buys.filter(b=>inP(b.date,p)),fij=fixedFor(p),inv=invx+sum(bu,b=>b.total);
  return{sl,ex,rev,cogs,gb:rev-cogs,gas,fij,inv,invx,bu,net:rev-cogs-gas-fij};
}
function byProd(sl){
  const m={};
  sl.forEach(s=>{const k=s.pid||s.name;m[k]=m[k]||{name:s.name,qty:0,gain:0};m[k].qty+=s.qty;m[k].gain+=s.qty*(s.price-s.cost)});
  return m;
}
const debts=()=>({neg:sum(S.mov.filter(m=>m.type==='saque'),m=>m.amount)-sum(S.mov.filter(m=>m.type==='repuse'),m=>m.amount),
  pre:sum(S.mov.filter(m=>m.type==='pedi'),m=>m.amount)-sum(S.mov.filter(m=>m.type==='devolvi'),m=>m.amount)});
const perBar=()=>'<div class="seg">'+PER.map(([k,t])=>`<button data-per="${k}" class="${per===k?'on':''}">${t}</button>`).join('')+'</div>';
const row=(l,v,t)=>`<div class="r ${t?'t':''}"><span>${l}</span><b class="${v<0?'neg':''}">${fm(v)}</b></div>`;
const del=k=>`<button class="x" data-del="${k}">borrar</button>`;
const MEDIOS=[['ef','Efectivo'],['tr','Transferencia'],['mp','Mercado Pago']];
const pm=x=>x.pm||'ef';
function bal(k){
  const f=a=>a.filter(x=>pm(x)===k);
  return (S.init[k]||0)+sum(f(S.sales),s=>s.paid==null?s.qty*s.price:s.paid)+sum(f(S.pays),p=>p.amount)-sum(f(S.exp),e=>e.amount)-sum(f(S.buys),b=>b.total)+sum(f(S.mov),m=>m.type==='repuse'||m.type==='pedi'?m.amount:-m.amount);
}
function fixedFor(p){
  const m=sum(S.fixed,f=>f.amount);if(!m)return 0;
  const n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
  if(p==='m')return m;if(p==='d')return m/dim;if(p==='w')return m*7/dim;
  const ds=[].concat(S.sales,S.exp,S.buys,S.mov).map(x=>x.date).sort(),f=ds[0]||today();
  return m*Math.max(1,(n.getFullYear()-+f.slice(0,4))*12+(n.getMonth()+1-+f.slice(5,7))+1);
}
function mediosBox(){
  return '<div class="ledger">'+MEDIOS.map(([k,t])=>`<div class="r"><span>${t} <button class="x" data-adj="${k}">ajustar</button></span><b class="${bal(k)<0?'neg':''}">${fm(bal(k))}</b></div>`).join('')+row('Total',sum(MEDIOS,m=>bal(m[0])),1)+'</div><p class="note">Se calcula con tus ventas cobradas, gastos, compras y movimientos. Si no coincide con lo que realmente tenés, tocá “ajustar”.</p>';
}
function metaBox(){
  const c=calc('m'),cost=c.gas+c.fij,mg=c.rev>0?c.gb/c.rev:0,g=S.goal||0;
  let h='<h2>Meta y punto de equilibrio de este mes</h2>';
  if(g>0){const pc=Math.max(0,Math.min(100,c.net/g*100));h+=`<div class="debt"><div>Meta de ganancia neta<small>Llevás ${fm(c.net)} (${Math.round(c.net/g*100)}%)</small></div><b>${fm(g)}</b></div><div class="bar"><i style="width:${pc}%"></i></div>`}
  if(cost>0&&mg>0){
    const eq=cost/mg;
    h+=`<div class="ledger">${row('Gastos y gastos fijos del mes',cost)}${row('Tenés que vender para no perder',eq)}${row('Ya vendiste',c.rev)}${row(c.rev>=eq?'Ya cubriste tus gastos':'Te faltan para no perder',Math.max(0,eq-c.rev),1)}</div>`;
    if(g>0){const need=(g+cost)/mg;h+=`<p class="note">Para llegar a tu meta tenés que vender <b>${fm(need)}</b> este mes. Te faltan <b>${fm(Math.max(0,need-c.rev))}</b>.</p>`}
  }else h+='<p class="note">Cuando cargues ventas y gastos, acá ves cuánto tenés que vender para no perder.</p>';
  return h+`<button class="add" style="margin-top:10px" data-goal="1">${g>0?'Cambiar meta':'Poner meta del mes'}</button>`;
}
function fixedBox(){
  const m=sum(S.fixed,f=>f.amount);
  return '<h2>Gastos fijos por mes</h2><button class="add" data-add="fix">Nuevo gasto fijo</button>'+(S.fixed.length?S.fixed.map(f=>`<div class="item"><div><b>${esc(f.desc)}</b><small>Por mes</small></div><div class="amt"><b>${fm(f.amount)}</b>${del('fixed:'+f.id)}</div></div>`).join('')+`<p class="note">Total por mes: <b>${fm(m)}</b>. Se reparten por día en el Resumen, así que no los cargues de nuevo como gasto.</p>`:'<p class="note">Alquiler, internet, luz, sueldos: lo que pagás todos los meses. Lo cargás una vez y se resta solo de la ganancia.</p>');
}
const cbal=c=>sum(S.sales.filter(s=>s.cid===c.id),s=>s.qty*s.price-(s.paid==null?s.qty*s.price:s.paid))-sum(S.pays.filter(p=>p.cid===c.id),p=>p.amount);
function lowStock(){const l=S.products.filter(p=>p.min>0&&stk(p)<=p.min);return l.length?'<h2>Hay que reponer</h2>'+l.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><small>Avisás cuando quedan ${p.min}</small></div><div class="amt"><b class="warn">${stk(p)} disponibles</b></div></div>`).join(''):''}
function debtCards(){
  const d=debts();
  const c=(l,v,sub,neg)=>`<div class="debt"><div>${l}<small>${v<0?(neg||'Repusiste de más'):sub}</small></div><b class="${v>0?'warn':''}">${fm(Math.abs(v))}</b></div>`;
  return c('Le debo al negocio',d.neg,'Plata que usaste y falta reponer')+c('Préstamos por devolver',d.pre,'Plata que pediste prestada')+(S.clients.length?c('Clientes te deben',sum(S.clients,cbal),'Ventas fiadas sin cobrar','Clientes pagaron de más'):'');
}

const VIEWS={
  res(){
    const c=calc(per),top=Object.values(byProd(c.sl)).sort((a,b)=>b.gain-a.gain).slice(0,5);
    return perBar()+`<section class="hero"><p class="lbl">Ganancia neta ${PL[per]}</p><p class="big ${c.net<0?'neg':'pos'}">${fm(c.net)}</p></section>
    <div class="ledger">${row('Ventas',c.rev)}${row('Costo de la mercadería',-c.cogs)}${row('Ganancia bruta',c.gb,1)}${row('Gastos',-c.gas)}${row('Gastos fijos',-c.fij)}${row('Ganancia neta',c.net,1)}</div>
    <p class="note">Invertido ${PL[per]}: <b>${fm(c.inv)}</b>. Las inversiones no restan de la ganancia.</p>
    <h2>Plata y deudas</h2>${debtCards()}<h2>Dónde está tu plata</h2>${mediosBox()}${metaBox()}
    <h2>Lo que más te dejó ${PL[per]}</h2>`+(top.length?top.map(p=>`<div class="item"><div><b>${esc(p.name)}</b><small>${p.qty} vendidos</small></div><div class="amt"><b class="${p.gain<0?'neg':'pos'}">${fm(p.gain)}</b></div></div>`).join(''):'<div class="empty">Todavía no hay ventas en este período.</div>')+lowStock();
  },
  ven(){
    const c=calc(per),l=c.sl.slice().sort((a,b)=>b.date.localeCompare(a.date));
    return perBar()+'<button class="add" data-add="sale2">Nueva venta</button>'+(l.length?`<p class="note">${l.length} ventas ${PL[per]}: <b>${fm(c.rev)}</b>, ganancia <b>${fm(c.gb)}</b></p>`+l.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><small>${s.qty} × ${fm(s.price)}, ${fd(s.date)}${s.tn?', '+esc(s.tn):''}${s.cname?', '+esc(s.cname):''}${s.paid!=null&&s.paid<s.qty*s.price?', debe '+fm(s.qty*s.price-s.paid):''}</small></div><div class="amt"><b>${fm(s.qty*s.price)}</b><small class="${s.price>=s.cost?'pos':'neg'}">gana ${fm(s.qty*(s.price-s.cost))}</small>${del('sales:'+s.id)}</div></div>`).join(''):'<div class="empty">No hay ventas en este período. Tocá “Nueva venta” para cargar la primera.</div>');
  },
  inv(){
    const c=calc(per),l=c.bu.slice().sort((a,b)=>b.date.localeCompare(a.date));
    return perBar()+'<button class="add" data-add="buy">Compra de producto</button><button class="add" data-add="ins">Compra de insumo (estampas, bolsas, etiquetas)</button>'+`<p class="note">Invertido en mercadería ${PL[per]}: <b>${fm(sum(c.bu,b=>b.total))}</b></p>`+(l.length?l.map(b=>`<div class="item edit" data-ebuy="${b.id}"><div><b>${esc(b.name)}</b><small>${b.qty} unidades, ${fd(b.date)}${b.note?', '+esc(b.note):''}</small></div><div class="amt"><b>${fm(b.total)}</b><small>${fm(b.total/b.qty)} c/u</small>${del('buys:'+b.id)}</div></div>`).join(''):'<div class="empty">Cuando compres o mandes a hacer mercadería, cargala acá y se suma sola al stock.</div>')+insBox();
  },
  gas(){
    const c=calc(per),l=c.ex.slice().sort((a,b)=>b.date.localeCompare(a.date));
    return perBar()+'<button class="add" data-add="exp">Nuevo gasto o inversión</button>'+`<p class="note">Gastos ${PL[per]}: <b>${fm(c.gas)}</b>. Inversiones: <b>${fm(c.invx)}</b></p>`+(l.length?l.map(e=>`<div class="item"><div><b>${esc(e.desc)}</b><small><span class="tag">${e.type==='gasto'?'Gasto':'Inversión'}</span>${fd(e.date)}</small></div><div class="amt"><b>${fm(e.amount)}</b>${del('exp:'+e.id)}</div></div>`).join(''):'<div class="empty">No hay gastos ni inversiones en este período.</div>')+fixedBox();
  },
  pro(){
    const sl=S.sales.filter(s=>inP(s.date,per)),m=byProd(sl);
    const l=S.products.map(p=>({p,q:(m[p.id]||{}).qty||0,g:(m[p.id]||{}).gain||0})).sort((a,b)=>b.g-a.g);
    return perBar()+'<button class="add" data-add="prod">Nuevo producto</button>'+(l.length?l.map(({p,q,g})=>`<div class="item edit" data-edit="${p.id}"><div><b>${esc(p.name)}</b><small>Costo ${fm(p.cost)}, precio ${fm(p.price)}, margen ${p.price>0?Math.round((p.price-p.cost)/p.price*100):0}%</small>${p.parts&&p.parts.length>1?'<small>'+p.parts.map(x=>esc(x.n)+' '+fm(x.iid?x.q*ucost(x.iid):x.c)).join(', ')+'</small>':''}<small class="${p.min>0&&stk(p)<=p.min?'warn':''}">${(p.parts||[]).some(x=>x.iid)?'Alcanza para '+stk(p):'Stock '+stk(p)}${p.min>0&&stk(p)<=p.min?', queda poco':''}</small>${(p.prices||[]).length?'<small>'+p.prices.map(l=>esc(l.n)+' '+fm(l.p)+(l.min?' (desde '+l.min+')':'')).join(', ')+'</small>':''}</div><div class="amt"><b class="${g<0?'neg':'pos'}">${fm(g)}</b><small>${q} vendidos</small>${del('products:'+p.id)}</div></div>`).join('')+'<p class="note">Tocá un producto para cambiarle el costo o el precio. Las ventas ya cargadas no se modifican.</p>':'<div class="empty">Cargá tus productos (joggers, baggies, hoodies) con su costo y precio.</div>');
  },
  cli(){
    const l=S.clients.map(c=>({c,b:cbal(c),t:sum(S.sales.filter(s=>s.cid===c.id),s=>s.qty*s.price)})).sort((a,b)=>b.b-a.b);
    return '<div style="height:10px"></div><button class="add" data-add="cli">Nuevo cliente</button>'+(l.length?`<p class="note">Te deben en total: <b>${fm(sum(l,x=>Math.max(x.b,0)))}</b></p>`+l.map(({c,b,t})=>`<div class="item"><div><b>${esc(c.name)}</b><small>Te compró ${fm(t)} en total</small></div><div class="amt"><b class="${b>0?'warn':'pos'}">${b>0?'Debe '+fm(b):b<0?'A favor '+fm(-b):'Al día'}</b>${b>0?'<button class="x" style="color:var(--acc)" data-pay="'+c.id+'">cobrar</button> ':''}${del('clients:'+c.id)}</div></div>`).join(''):'<div class="empty">Cargá a tus clientes para anotar quién te compra y quién te debe.</div>');
  },
  pla(){
    const l=S.mov.slice().sort((a,b)=>b.date.localeCompare(a.date));
    return '<div style="height:10px"></div>'+debtCards()+'<button class="add" data-add="mov">Nuevo movimiento</button>'+(l.length?l.map(m=>`<div class="item"><div><b>${MOV[m.type]}</b><small>${fd(m.date)}${m.note?', '+esc(m.note):''}</small></div><div class="amt"><b class="${m.type==='saque'||m.type==='pedi'?'warn':'pos'}">${fm(m.amount)}</b>${del('mov:'+m.id)}</div></div>`).join(''):'<div class="empty">Cuando uses plata del negocio o pidas prestado, anotalo acá. Al devolverla, cargá la reposición y la deuda baja sola.</div>');
  }
};

function render(){
  $('#v').innerHTML=VIEWS[tab]();
  $('#nav').innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${t}</button>`).join('');
  const a=$('#nav .on');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});
}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}

function sheet(title,fields,ok,label,init,intro){
  const el=$('#sh');
  el.innerHTML=`<div class="bk"></div><div class="pn"><h3>${title}</h3>${intro?'<p>'+intro+'</p>':''}`+fields.map(f=>{
    if(f.t==='select')return `<label>${f.l}<select id="f_${f.id}">${f.o.map(([v,t])=>`<option value="${v}"${v==f.v?' selected':''}>${t}</option>`).join('')}</select></label>`;
    if(f.t==='items')return `<label>${f.l}</label><div id="f_${f.id}"></div><button class="link" type="button" id="addi">+ Agregar otro producto</button><p class="note" id="stot"></p>`;
    if(f.t==='levels')return `<label>${f.l}</label><div id="f_${f.id}">${f.v.map(levelRow).join('')}</div><button class="link" type="button" id="addl">+ Agregar precio</button>`;
    if(f.t==='parts')return `<label>${f.l}</label><div id="f_${f.id}">${f.v.map(x=>partRow2(x)).join('')}</div><button class="link" type="button" id="addp">+ Agregar componente</button><p class="note" id="ptot"></p>`;
    if(f.t==='area')return `<label>${f.l}<textarea id="f_${f.id}">${esc(f.v)}</textarea></label>`;
    return `<label>${f.l}<input id="f_${f.id}" type="${f.t==='date'?'date':'text'}"${f.t==='n'||f.m?' inputmode="decimal"':''} value="${esc(f.v==null?'':f.v)}"></label>`;
  }).join('')+`<div class="btns"><button class="ghost" id="no">Cancelar</button><button id="yes">${label||'Guardar'}</button></div></div>`;
  el.hidden=false;
  const els={};fields.forEach(f=>els[f.id]=$('#f_'+f.id));
  const close=()=>{el.hidden=true;el.innerHTML=''};
  $('#no').onclick=close;el.querySelector('.bk').onclick=close;
  if(init)init(els);
  $('#yes').onclick=()=>{
    const v={};fields.forEach(f=>{if(f.t==='items'){v[f.id]=[...els[f.id].querySelectorAll('.ir')].map(r=>{const p=S.products.find(y=>y.id===r.querySelector('.isp').value),t=r.querySelector('.itp').value;return{pid:p.id,q:pn(r.querySelector('.iq').value),pr:pn(r.querySelector('.ipr').value),tn:t===''?'':((p.prices||[])[t]||{}).n||''}});return}if(f.t==='levels'){v[f.id]=[...els[f.id].querySelectorAll('.pr')].map(r=>({n:r.querySelector('.lnm').value.trim()||'Precio',p:pn(r.querySelector('.lpr').value),min:pn(r.querySelector('.lmn').value)})).filter(x=>x.p>0);return}if(f.t==='parts'){v[f.id]=[...els[f.id].querySelectorAll('.pr')].map(r=>{const s=r.querySelector('.pis').value,w=pn(r.querySelector('.pcs').value);return s?{iid:s,n:comps().find(i=>i.id===s).name,q:w}:{n:r.querySelector('.pnm').value.trim(),c:w}}).filter(x=>x.c>0||x.q>0);return}const x=els[f.id].value;v[f.id]=f.t==='n'?pn(x):(f.t==='date'&&!x?today():x.trim?x.trim():x)});
    const err=ok(v);
    if(err){toast(err);return}
    save();close();render();
  };
}

function partRow(n,c){return `<div class="pr"><input class="pnm" placeholder="Ej: estampa" value="${esc(n)}"><input class="pcs" inputmode="decimal" placeholder="Costo" value="${c===''?'':c}"><button type="button" class="xr">✕</button></div>`}
function partRow2(x){x=x||{};return `<div class="pr"><select class="pis"><option value="">Otro costo</option>${comps().map(i=>`<option value="${i.id}"${x.iid===i.id?' selected':''}>${esc(i.name)}</option>`).join('')}</select><input class="pnm" placeholder="Detalle" value="${esc(x.n||'')}"${x.iid?' hidden':''}><input class="pcs" inputmode="decimal" placeholder="${x.iid?'Cant. por unidad':'Costo'}" value="${x.iid?(x.q||''):(x.c||'')}"><button type="button" class="xr">✕</button></div>`}
const levelRow=l=>`<div class="pr"><input class="lnm" placeholder="Ej: por curva" value="${esc(l.n||'')}"><input class="lpr" inputmode="decimal" placeholder="Precio" value="${l.p||''}"><input class="lmn" inputmode="decimal" placeholder="Desde (u.)" value="${l.min||''}"><button type="button" class="xr">✕</button></div>`;
function levelsInit(f){const b=f.l;b.onclick=e=>{const x=e.target.closest('.xr');if(x)x.parentNode.remove()};$('#addl').onclick=()=>b.insertAdjacentHTML('beforeend',levelRow({}))}
const ucost=id=>{if(!S.ins.some(i=>i.id===id)){const p=S.products.find(x=>x.id===id);return p?p.cost||0:0}const b=S.buys.filter(x=>x.iid===id),q=sum(b,x=>x.qty);return q>0?sum(b,x=>x.total)/q:0};
const comps=()=>S.ins.concat(S.products);
const avail=id=>S.ins.some(i=>i.id===id)?sum(S.buys.filter(b=>b.iid===id),b=>b.qty)-sum(S.sales,s=>sum((s.use||[]).filter(u=>u.iid===id),u=>u.n)):((S.products.find(p=>p.id===id)||{}).stock||0);
const stk=p=>{const c=(p.parts||[]).filter(x=>x.iid&&x.q>0);return c.length?Math.max(0,Math.floor(Math.min(...c.map(x=>avail(x.iid)/x.q)))):(p.stock||0)};
const itemRow=()=>`<div class="ir"><div class="pr"><select class="isp">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (stock ${stk(p)})</option>`).join('')}</select><button type="button" class="xr">✕</button></div><div class="pr"><input class="iq" inputmode="decimal" value="1" placeholder="Cant."><select class="itp"></select><input class="ipr" inputmode="decimal" placeholder="Precio"></div></div>`;
function rowSync(r,m){
  const p=S.products.find(x=>x.id===r.querySelector('.isp').value),q=pn(r.querySelector('.iq').value),tp=r.querySelector('.itp'),L=p.prices||[];
  if(m==='p'){tp.dataset.man='';tp.innerHTML='<option value="">Normal ('+fm(p.price)+')</option>'+L.map((l,i)=>`<option value="${i}">${esc(l.n)} (${fm(l.p)}${l.min?', desde '+l.min:''})</option>`).join('')}
  if(m==='t')tp.dataset.man=1;
  if(m!=='t'&&!tp.dataset.man){let b='';L.forEach((l,i)=>{if(l.min>0&&q>=l.min&&(b===''||l.min>L[b].min))b=i});tp.value=b}
  r.querySelector('.ipr').value=tp.value===''?p.price:L[tp.value].p;
}
function itemsInit(f){
  const box=f.it,tot=()=>{let t=0,g=0;box.querySelectorAll('.ir').forEach(r=>{const p=S.products.find(x=>x.id===r.querySelector('.isp').value),q=pn(r.querySelector('.iq').value),pr=pn(r.querySelector('.ipr').value);t+=q*pr;g+=q*(pr-p.cost)});$('#stot').innerHTML='Total de la venta: <b>'+fm(t)+'</b>, ganancia <b>'+fm(g)+'</b>'};
  const add=()=>{box.insertAdjacentHTML('beforeend',itemRow());rowSync(box.lastElementChild,'p');tot()};
  box.oninput=e=>{const r=e.target.closest('.ir');if(e.target.classList.contains('iq'))rowSync(r,'q');tot()};
  box.onchange=e=>{const r=e.target.closest('.ir');if(e.target.classList.contains('isp'))rowSync(r,'p');else if(e.target.classList.contains('itp'))rowSync(r,'t');tot()};
  box.onclick=e=>{const x=e.target.closest('.xr');if(x&&box.children.length>1){x.closest('.ir').remove();tot()}};
  $('#addi').onclick=add;add();
}
function recost(){
  S.products.forEach(p=>{const b=S.buys.filter(x=>x.pid===p.id);if(b.length&&!(p.parts||[]).some(x=>x.iid)){const a=sum(b,x=>x.total)/Math.max(1,sum(b,x=>x.qty));p.cost=a;p.parts=[{n:'Compra (promedio)',c:a}]}});
  for(let k=0;k<3;k++)S.products.forEach(p=>{if(p.parts&&p.parts.some(x=>x.iid))p.cost=sum(p.parts,x=>x.iid?x.q*ucost(x.iid):x.c)});
}
function insBox(){return S.ins.length?'<h2>Insumos y costo por unidad</h2>'+S.ins.map(i=>`<div class="item"><div><b>${esc(i.name)}</b><small>${sum(S.buys.filter(b=>b.iid===i.id),b=>b.qty)} unidades compradas, quedan ${avail(i.id)}</small></div><div class="amt"><b>${fm(ucost(i.id))}</b><small>por unidad</small></div></div>`).join('')+'<p class="note">En cada producto elegís qué insumos usa y cuántos por unidad. El costo se actualiza solo con tus compras.</p>':''}
function partsInit(f){
  const box=f.k,tot=()=>{$('#ptot').innerHTML='Costo total por unidad: <b>'+fm(sum([...box.querySelectorAll('.pr')],r=>{const s=r.querySelector('.pis').value,w=pn(r.querySelector('.pcs').value);return s?w*ucost(s):w}))+'</b>'};
  box.oninput=tot;box.onchange=e=>{const s=e.target.closest('.pis');if(s){const r=s.parentNode;r.querySelector('.pnm').hidden=!!s.value;r.querySelector('.pcs').placeholder=s.value?'Cant. por unidad':'Costo';tot()}};
  box.onclick=e=>{const b=e.target.closest('.xr');if(b){b.parentNode.remove();tot()}};
  $('#addp').onclick=()=>{box.insertAdjacentHTML('beforeend',partRow2());tot()};
  tot();
}
function add(k,id){
  if(k==='sale'){
    if(!S.products.length){toast('Primero cargá un producto');tab='pro';render();return}
    const p0=S.products[0];
    sheet('Nueva venta',[{id:'p',l:'Producto',t:'select',o:S.products.map(p=>[p.id,esc(p.name)+' (stock '+(p.stock||0)+')']),v:p0.id},{id:'q',l:'Cantidad',t:'n',v:1},{id:'tp',l:'Tipo de precio',t:'select',o:[['','Precio normal']],v:''},{id:'pr',l:'Precio de venta por unidad',t:'n',v:p0.price},{id:'c',l:'Cliente (opcional)',t:'select',o:[['','Sin cliente']].concat(S.clients.map(c=>[c.id,esc(c.name)])),v:''},{id:'g',l:'Cuánto pagó ahora (vacío = pagó todo)',t:'text',m:1,v:''},{id:'pm',l:'Cómo pagó',t:'select',o:MEDIOS,v:'ef'},{id:'d',l:'Fecha',t:'date',v:today()}],v=>{
      const p=S.products.find(x=>x.id===v.p);
      if(v.q<=0||v.pr<=0)return 'Poné cantidad y precio';
      const tot=v.q*v.pr,paid=v.g===''?tot:pn(v.g),cl=S.clients.find(x=>x.id===v.c);
      if(!cl&&paid<tot)return 'Elegí el cliente para anotar lo que debe';
      S.sales.push({id:uid(),date:v.d,pid:p.id,name:p.name,qty:v.q,price:v.pr,cost:p.cost,cid:cl?cl.id:'',cname:cl?cl.name:'',paid:Math.min(paid,tot),pm:v.pm,tn:v.tp===''?'':((p.prices||[])[v.tp]||{}).n||''});
      p.stock=(p.stock||0)-v.q;
    },'Guardar venta',f=>{
      let man=false;
      const P=()=>S.products.find(x=>x.id===f.p.value);
      const fill=()=>{const p=P();f.tp.innerHTML='<option value="">Precio normal ('+fm(p.price)+')</option>'+(p.prices||[]).map((l,i)=>`<option value="${i}">${esc(l.n)} (${fm(l.p)}${l.min?', desde '+l.min:''})</option>`).join('')};
      const pick=()=>{const p=P(),q=pn(f.q.value);if(!man){let b='';(p.prices||[]).forEach((l,i)=>{if(l.min>0&&q>=l.min&&(b===''||l.min>p.prices[b].min))b=i});f.tp.value=b}const l=f.tp.value===''?null:p.prices[f.tp.value];f.pr.value=l?l.p:p.price};
      f.p.onchange=()=>{man=false;fill();pick()};f.q.oninput=pick;f.tp.onchange=()=>{man=true;pick()};fill();pick();
    });
  }else if(k==='exp'){
    sheet('Nuevo gasto o inversión',[{id:'t',l:'Tipo',t:'select',o:[['gasto','Gasto del negocio'],['inversion','Inversión']],v:'gasto'},{id:'s',l:'Detalle',t:'text',v:''},{id:'a',l:'Monto',t:'n',v:''},{id:'pm',l:'Pagado con',t:'select',o:MEDIOS,v:'ef'},{id:'d',l:'Fecha',t:'date',v:today()}],v=>{
      if(!v.s||v.a<=0)return 'Poné el detalle y el monto';
      S.exp.push({id:uid(),date:v.d,type:v.t,desc:v.s,amount:v.a,pm:v.pm});
    },'Guardar',null,'Un gasto resta de la ganancia. Una inversión (máquinas, stock grande, mejoras) se muestra aparte.');
  }else if(k==='prod'||k==='edit'){
    const p=k==='edit'?S.products.find(x=>x.id===id):null;
    const parts=p?(p.parts&&p.parts.length?p.parts:[{n:'Costo total',c:p.cost}]):[{n:'Prenda',c:''},{n:'Estampa',c:''},{n:'Bolsa',c:''},{n:'Etiqueta',c:''}];
    sheet(p?'Editar producto':'Nuevo producto',[{id:'n',l:'Nombre',t:'text',v:p?p.name:''},{id:'k',l:'Costos de cada unidad',t:'parts',v:parts},{id:'p',l:'Precio normal por unidad',t:'n',v:p?p.price:''},{id:'l',l:'Otros precios: por curva, por mayor, por cantidad',t:'levels',v:p?p.prices||[]:[]},{id:'s',l:'Stock actual (unidades)',t:'n',v:p?p.stock||0:0},{id:'m',l:'Avisarme cuando queden (0 = no avisar)',t:'n',v:p?p.min||0:0}],v=>{
      if(!v.n||v.p<=0)return 'Poné el nombre y el precio';
      const cost=sum(v.k,x=>x.iid?x.q*ucost(x.iid):x.c);
      if(p){p.name=v.n;p.parts=v.k;p.cost=cost;p.price=v.p;p.stock=v.s;p.min=v.m;p.prices=v.l}else S.products.push({id:uid(),name:v.n,parts:v.k,cost:cost,price:v.p,stock:v.s,min:v.m,prices:v.l});
    },'Guardar',f=>{partsInit(f);levelsInit(f)},'Sumá todo lo que cuesta hacer una unidad: la prenda, la estampa, la bolsa, la etiqueta. El costo del producto es el total.');
  }else if(k==='buy'){
    if(!S.products.length){toast('Primero cargá un producto');tab='pro';render();return}
    sheet('Nueva compra',[{id:'p',l:'Producto',t:'select',o:S.products.map(p=>[p.id,esc(p.name)+' (stock '+(p.stock||0)+')']),v:S.products[0].id},{id:'q',l:'Cantidad que compraste',t:'n',v:''},{id:'t',l:'Costo total de la compra',t:'n',v:''},{id:'pm',l:'Pagado con',t:'select',o:MEDIOS,v:'ef'},{id:'d',l:'Fecha',t:'date',v:today()},{id:'s',l:'Nota (opcional)',t:'text',v:''}],v=>{
      const p=S.products.find(x=>x.id===v.p);
      if(v.q<=0||v.t<=0)return 'Poné la cantidad y el costo total';
      S.buys.push({id:uid(),date:v.d,pid:p.id,name:p.name,qty:v.q,total:v.t,note:v.s,pm:v.pm});
      p.stock=(p.stock||0)+v.q;
    },'Guardar compra',f=>{
      let touched=false;
      const up=()=>{if(touched)return;const p=S.products.find(x=>x.id===f.p.value);void p};
      f.t.oninput=()=>{touched=true};f.p.onchange=up;f.q.oninput=up;
    },'Se suma al stock del producto y cuenta como inversión. Poné cuántas unidades compraste y cuánto pagaste en total. El costo de cada unidad es el total dividido la cantidad, y ese pasa a ser el costo del producto.');
  }else if(k==='sale2'){
    if(!S.products.length){toast('Primero cargá un producto');tab='pro';render();return}
    sheet('Nueva venta',[{id:'it',l:'Productos',t:'items'},{id:'c',l:'Cliente (opcional)',t:'select',o:[['','Sin cliente']].concat(S.clients.map(c=>[c.id,esc(c.name)])),v:''},{id:'g',l:'Cuánto pagó ahora en total (vacío = pagó todo)',t:'text',m:1,v:''},{id:'pm',l:'Cómo pagó',t:'select',o:MEDIOS,v:'ef'},{id:'d',l:'Fecha',t:'date',v:today()}],v=>{
      const its=v.it.filter(x=>x.q>0&&x.pr>0);
      if(!its.length)return 'Poné cantidad y precio en cada producto';
      const tot=sum(its,x=>x.q*x.pr),paid=v.g===''?tot:pn(v.g),cl=S.clients.find(x=>x.id===v.c);
      if(!cl&&paid<tot)return 'Elegí el cliente para anotar lo que debe';
      const gid=uid();
      its.forEach(x=>{
        const p=S.products.find(y=>y.id===x.pid),t=x.q*x.pr;
        const s={id:uid(),gid,date:v.d,pid:p.id,name:p.name,qty:x.q,price:x.pr,cost:p.cost,cid:cl?cl.id:'',cname:cl?cl.name:'',paid:Math.min(t,paid*t/tot),pm:v.pm,tn:x.tn};
        const use=(p.parts||[]).filter(y=>y.iid&&y.q>0).map(y=>({iid:y.iid,n:x.q*y.q}));
        if(use.length){s.use=use;use.forEach(u=>{const c=S.products.find(y=>y.id===u.iid);if(c)c.stock=(c.stock||0)-u.n})}else p.stock=(p.stock||0)-x.q;
        S.sales.push(s);
      });
    },'Guardar venta',itemsInit);
  }else if(k==='ebuy'){
    const b=S.buys.find(x=>x.id===id);
    sheet('Editar compra: '+esc(b.name),[{id:'q',l:'Cantidad',t:'n',v:b.qty},{id:'t',l:'Costo total pagado',t:'n',v:b.total}],v=>{
      if(v.q<=0||v.t<=0)return 'Poné la cantidad y el costo total';
      const p=b.pid&&S.products.find(x=>x.id===b.pid);if(p)p.stock=(p.stock||0)+v.q-b.qty;

    });
  }else if(k==='ins'){
    sheet('Compra de insumo',[{id:'i',l:'Insumo',t:'select',o:S.ins.map(i=>[i.id,esc(i.name)]).concat([['new','Insumo nuevo']]),v:S.ins.length?S.ins[0].id:'new'},{id:'n',l:'Nombre (solo si es nuevo)',t:'text',v:''},{id:'q',l:'Cantidad que vino',t:'n',v:''},{id:'t',l:'Costo total',t:'n',v:''},{id:'pm',l:'Pagado con',t:'select',o:MEDIOS,v:'ef'},{id:'d',l:'Fecha',t:'date',v:today()}],v=>{
      let i=S.ins.find(x=>x.id===v.i);
      if(!i&&!v.n)return 'Poné el nombre del insumo';
      if(v.q<=0||v.t<=0)return 'Poné la cantidad y el costo total';
      if(!i){i={id:uid(),name:v.n};S.ins.push(i)}
      S.buys.push({id:uid(),date:v.d,iid:i.id,name:i.name,qty:v.q,total:v.t,pm:v.pm});
    },'Guardar compra',null,'Ej: 100.000 en estampas que vinieron 500: cantidad 500, costo total 100.000. Cada una te sale $200 y se suma al costo de los productos que la usen. Con el transporte, la cantidad es a cuántos productos alcanza.');
  }else if(k==='fix'){
    sheet('Nuevo gasto fijo',[{id:'s',l:'Detalle',t:'text',v:''},{id:'a',l:'Monto por mes',t:'n',v:''}],v=>{if(!v.s||v.a<=0)return 'Poné el detalle y el monto';S.fixed.push({id:uid(),desc:v.s,amount:v.a})});
  }else if(k==='adj'){
    const mn=MEDIOS.find(m=>m[0]===id)[1];
    sheet('Ajustar saldo: '+mn,[{id:'a',l:'Cuánto tenés realmente ahora',t:'n',v:Math.round(bal(id))}],v=>{S.init[id]=(S.init[id]||0)+v.a-bal(id)},'Guardar saldo');
  }else if(k==='goal'){
    sheet('Meta del mes',[{id:'a',l:'Ganancia neta que querés lograr este mes',t:'n',v:S.goal||''}],v=>{if(v.a<0)return 'Poné un monto válido';S.goal=v.a},'Guardar meta');
  }else if(k==='cli'){
    sheet('Nuevo cliente',[{id:'n',l:'Nombre',t:'text',v:''}],v=>{if(!v.n)return 'Poné el nombre';S.clients.push({id:uid(),name:v.n})});
  }else if(k==='pay'){
    const c=S.clients.find(x=>x.id===id),b=cbal(c);
    sheet('Cobrar a '+esc(c.name),[{id:'a',l:'Monto cobrado',t:'n',v:Math.round(b)},{id:'pm',l:'Cobrado por',t:'select',o:MEDIOS,v:'ef'},{id:'d',l:'Fecha',t:'date',v:today()}],v=>{if(v.a<=0)return 'Poné el monto';S.pays.push({id:uid(),cid:c.id,date:v.d,amount:v.a,pm:v.pm})},'Registrar cobro');
  }else if(k==='mov'){
    sheet('Nuevo movimiento',[{id:'t',l:'¿Qué pasó?',t:'select',o:Object.entries(MOV),v:'saque'},{id:'a',l:'Monto',t:'n',v:''},{id:'pm',l:'Con qué medio',t:'select',o:MEDIOS,v:'ef'},{id:'s',l:'Nota (opcional)',t:'text',v:''},{id:'d',l:'Fecha',t:'date',v:today()}],v=>{
      if(v.a<=0)return 'Poné el monto';
      S.mov.push({id:uid(),date:v.d,type:v.t,amount:v.a,note:v.s,pm:v.pm});
    });
  }
}

$('#v').onclick=e=>{
  const t=e.target.closest('[data-per],[data-add],[data-del],[data-edit],[data-pay],[data-adj],[data-goal],[data-ebuy]');
  if(!t)return;
  if(t.dataset.per){per=t.dataset.per;render()}
  else if(t.dataset.add)add(t.dataset.add);
  else if(t.dataset.del){
    if(!t.dataset.arm){t.dataset.arm=1;t.textContent='¿seguro? tocá de nuevo';t.classList.add('arm');setTimeout(()=>{t.dataset.arm='';t.textContent='borrar';t.classList.remove('arm')},3000);return}
    const [k,id]=t.dataset.del.split(':');if(k==='sales'){const s=S.sales.find(x=>x.id===id);if(s&&s.use)s.use.forEach(u=>{const c=S.products.find(x=>x.id===u.iid);if(c)c.stock=(c.stock||0)+u.n});else{const p=s&&S.products.find(x=>x.id===s.pid);if(p)p.stock=(p.stock||0)+s.qty}}if(k==='buys'){const b=S.buys.find(x=>x.id===id),p=b&&S.products.find(x=>x.id===b.pid);if(p)p.stock=(p.stock||0)-b.qty}S[k]=S[k].filter(x=>x.id!==id);save();render();
  }else if(t.dataset.edit)add('edit',t.dataset.edit);
  else if(t.dataset.pay)add('pay',t.dataset.pay);
  else if(t.dataset.adj)add('adj',t.dataset.adj);
  else if(t.dataset.goal)add('goal');
  else if(t.dataset.ebuy)add('ebuy',t.dataset.ebuy);
};
$('#nav').onclick=e=>{const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();window.scrollTo(0,0)}};
$('#bk').onclick=()=>sheet('Respaldo',[{id:'j',l:'Tus datos',t:'area',v:JSON.stringify(S)}],v=>{
  try{const o=JSON.parse(v.j);if(!Array.isArray(o.products)||!Array.isArray(o.sales))throw 0;S=Object.assign({products:[],sales:[],exp:[],mov:[],clients:[],pays:[],buys:[],fixed:[],init:{},goal:0,ins:[]},o)}catch(e){return 'El texto no es un respaldo válido'}
},'Restaurar',null,'Tus datos se guardan en este celular. Copiá este texto y guardalo en un lugar seguro; para recuperar todo, pegalo acá y tocá Restaurar.');
recost();render();
</script>
